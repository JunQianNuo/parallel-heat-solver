</g><g id="throughput-definition" font-family="KaiTi, Arial" fill="#000000" data-pptx-bounds="85 123 1120 204"><text x="85" y="159" font-size="36" font-family="KaiTi, Arial" fill="#000000" text-anchor="start">吞吐量：单位时间内完成的网格点更新次数</text><g id="throughput-formula" data-pptx-bounds="115 177 420 104"><text x="220" y="230" font-size="36" font-family="Cambria Math" fill="#000000"><tspan data-pptx-inline-formula="Q_p=\frac{W_p}{T_p}">Qₚ = Wₚ/Tₚ</tspan></text></g><g id="throughput-growth-formula" data-pptx-bounds="705 177 420 104"><text x="810" y="230" font-size="36" font-family="Cambria Math" fill="#000000"><tspan data-pptx-inline-formula="R_p=\frac{Q_p}{Q_1}">Rₚ = Qₚ/Q₁</tspan></text></g><text x="85" y="313" font-size="30" font-family="KaiTi, Arial" fill="#000000" text-anchor="start">Wₚ = M(N−1)²；Tₚ为推进耗时，各实现以自身 p = 1 为基准</text></g><g id="expanded-workload-table" data-pptx-replace-with="table" font-family="Arial" font-size="34" fill="#000000" data-pptx-fallback-sha256="1612d355a3aeeef43e57512f6ed95119da4f49077bb3fb91010efef5386e2f75"><metadata type="application/json">{"schema": "ppt-master.semantic-table.v2", "name": "expanded-workload-table", "x": 90, "y": 339, "width": 1100, "height": 216, "columns": [{"text": "p", "align": "ctr", "fill": "#115EA2", "color": "#FFFFFF", "font_size": 32}, {"text": "N", "align": "ctr", "fill": "#115EA2", "color": "#FFFFFF", "font_size": 32}, {"text": "M", "align": "ctr", "fill": "#115EA2", "color": "#FFFFFF", "font_size": 32}, {"text": "W/W₁", "align": "ctr", "fill": "#115EA2", "color": "#FFFFFF", "font_size": 32}, {"text": "MPI Rₚ", "align": "ctr", "fill": "#115EA2", "color": "#FFFFFF", "font_size": 32}, {"text": "OpenMP Rₚ", "align": "ctr", "fill": "#115EA2", "color": "#FFFFFF", "font_size": 32}], "rows": [[{"text": "1", "align": "r"}, {"text": "256", "align": "r"}, {"text": "4096", "align": "r"}, {"text": "1.0000", "align": "r"}, {"text": "1.0000", "align": "r"}, {"text": "1.0000", "align": "r"}], [{"text": "2", "align": "r"}, {"text": "3