<path d="M1670 160V440" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1290 160H1670" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1290 230H1670" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1290 300H1670" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1290 370H1670" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1290 440H1670" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1480" cy="300" r="43" fill="#115EA2" stroke="#115EA2" stroke-width="4"/>
<text x="1480" y="312" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="40" font-weight="normal" fill="white">U</text>
<text x="1480" y="494" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="38" font-weight="normal" fill="#092F51">同一坐标 (i, j)</text>
<text x="1480" y="539" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="38" font-weight="normal" fill="#092F51">独立缓冲 · next 只写</text>
</g>
<g aria-label="r = αΔt/h^2 ≤ 1/4     ·     时间一阶 / 空间二阶">
<text x="427.85" y="610" font-family="SimHei, Arial, sans-serif" font-size="38" fill="#092F51">r = αΔt/h</text>
<text x="636.85" y="595.56" font-family="SimHei, Arial, sans-serif" font-size="26.599999999999998" fill="#092F51">2</text>
<text x="650.15" y="610" font-family="SimHei, Arial, sans-serif" font-size="38" fill="#092F51"> ≤ 1/4     ·     时间一阶 / 空间二阶</text>
</g>
<path d="M44 647H1756" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>