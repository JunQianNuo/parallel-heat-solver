<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
<title id="title">二维五点显式更新与双缓冲时间推进</title><desc id="desc">旧层五个轴向点加权求和，写入独立新层。整层完成后交换缓冲并累计步数，恰好推进M步。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#115EA2"/></marker></defs>
<rect width="1800" height="1080" fill="white"/>
<rect x="42" y="30" width="670" height="530" rx="20" fill="#F8FBFE" stroke="#C9D7E3" stroke-width="3"/>
<rect x="1202" y="30" width="556" height="530" rx="20" fill="#F8FBFE" stroke="#C9D7E3" stroke-width="3"/>
<text x="377" y="75" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="44" font-weight="bold" fill="#092F51">旧层 old · n</text>
<text x="1480" y="75" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="44" font-weight="bold" fill="#092F51">新层 next · n+1</text>
<g id="old-layer" data-layer="n" data-access="read">
<path d="M115 138V482" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M245 138V482" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M375 138V482" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M505 138V482" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M635 138V482" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M95 160H655" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M95 300H655" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M95 440H655" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="375" cy="160" r="31" fill="white" stroke="#115EA2" stroke-width="4" data-site="north" data-weight="r" data-layer="n"/>
<text x="375" y="172" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="38" font-weight="normal" fill="#115EA2">r</text>
<text x="375" y="117" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="30" font-weight="normal" fill="#111111">(i-1, j)</text>
<circle cx="245" cy="300" r="31" fill="white" stroke="#115EA2" stroke-width="4" data-site="west" data-weight="r" data-layer="n"/>
<text x="245" y="312" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="38" font-weight="normal" fill="#115EA2">r</text>
<text x="150" y="365" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="32" font-weight="normal" fill="#111111">(i, j-1)</text>
<circle cx="505" cy="300" r="31" fill="white" stroke="#115EA2" stroke-width="4" data-site="east" data-weight="r" data-layer="n"/>
<text x="505" y="312" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="38" font-weight="normal" fill="#115EA2">r</text>
<text x="590" y="365" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="32" font-weight="normal" fill="#111111">(i, j+1)</text>
<circle cx="375" cy="440" r="31" fill="white" stroke="#115EA2" stroke-width="4" data-site="south" data-weight="r" data-layer="n"/>
<text x="375" y="452" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="38" font-weight="normal" fill="#115EA2">r</text>
<text x="375" y="505" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="30" font-weight="normal" fill="#111111">(i+1, j)</text>
<circle cx="375" cy="300" r="48" fill="#115EA2" stroke="#115EA2" stroke-width="4" data-site="center" data-weight="1-4r" data-layer="n"/>
<text x="375" y="311" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="32" font-weight="normal" fill="white">1-4r</text>
<text x="375" y="377" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="33" font-weight="normal" fill="#111111">(i, j)</text>
<text x="375" y="539" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="34" font-weight="normal" fill="#092F51">局部示意 · old 只读</text>
</g><g id="weighted-sum">
<path d="M728 300H814" fill="none" stroke="#115EA2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="915" cy="300" r="76" fill="#EAF2F8" stroke="#115EA2" stroke-width="4"/>
<text x="915" y="314" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="74" font-weight="normal" fill="#115EA2">Σ</text>
<text x="915" y="178" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="40" font-weight="bold" fill="#092F51">五点加权</text>
<text x="915" y="440" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="34" font-weight="normal" fill="#111111">中心 × (1-4r)</text>
<text x="915" y="485" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="34" font-weight="normal" fill="#111111">四邻点各 × r</text>
<path d="M1004 300H1265" fill="none" stroke="#115EA2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1115" y="269" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="36" font-weight="normal" fill="#115EA2">写入</text>
</g><g id="next-layer" data-layer="n+1" data-access="write">
<path d="M1290 160V440" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1385 160V440" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1480 160V440" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1575 160V440" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1670 160V440" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1290 160H1670" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1290 230H1670" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1290 300H1670" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1290 370H1670" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1290 440H1670" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1480" cy="300" r="43" fill="#115EA2" stroke="#115EA2" stroke-width="4"/>
<text x="1480" y="312" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="40" font-weight="normal" fill="white">U</text>
<text x="1480" y="494" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="38" font-weight="normal" fill="#092F51">同一坐标 (i, j)</text>
<text x="1480" y="539" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="34" font-weight="normal" fill="#092F51">独立缓冲 · next 只写</text>
</g>
<g aria-label="r = αΔt/h^2 ≤ 1/4     ·     时间一阶 / 空间二阶">
<text x="427.85" y="610" font-family="SimHei, Arial, sans-serif" font-size="38" fill="#092F51">r = αΔt/h</text>
<text x="636.85" y="595.56" font-family="SimHei, Arial, sans-serif" font-size="26.599999999999998" fill="#092F51">2</text>
<text x="650.15" y="610" font-family="SimHei, Arial, sans-serif" font-size="38" fill="#092F51"> ≤ 1/4     ·     时间一阶 / 空间二阶</text>
</g>
<path d="M44 647H1756" fill="none" stroke="#C9D7E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g id="time-loop">
<rect x="42" y="689" width="292" height="174" rx="20" fill="#F8FBFE" stroke="#C9D7E3" stroke-width="3"/>
<text x="188" y="739" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="40" font-weight="bold" fill="#092F51">初始化</text>
<g aria-label="old = U^0">
<text x="118.7" y="790" font-family="SimHei, Arial, sans-serif" font-size="36" fill="#111111">old = U</text>
<text x="244.7" y="776.32" font-family="SimHei, Arial, sans-serif" font-size="25.2" fill="#111111">0</text>
<text x="257.3" y="790" font-family="SimHei, Arial, sans-serif" font-size="36" fill="#111111"></text>
</g>
<text x="188" y="837" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="32" font-weight="normal" fill="#111111">next = 0, n = 0</text>
<rect x="390" y="689" width="366" height="174" rx="20" fill="#EAF2F8" stroke="#115EA2" stroke-width="3"/>
<text x="573" y="741" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="38" font-weight="bold" fill="#092F51">更新全部内部点</text>
<text x="573" y="790" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="36" font-weight="normal" fill="#115EA2">old → next</text>
<text x="573" y="836" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="30" font-weight="normal" fill="#111111">全局四条物理边界 = 0</text>
<path d="M341 776H380" fill="none" stroke="#115EA2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="812" y="689" width="252" height="174" rx="20" fill="#F8FBFE" stroke="#C9D7E3" stroke-width="3"/>
<text x="938" y="757" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="40" font-weight="bold" fill="#092F51">整层完成</text>
<text x="938" y="813" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="34" font-weight="normal" fill="#092F51">再交换</text>
<path d="M765 776H802" fill="none" stroke="#115EA2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1120" y="689" width="270" height="174" rx="20" fill="#EAF2F8" stroke="#115EA2" stroke-width="3"/>
<text x="1255" y="742" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#092F51">交换 old / next</text>
<text x="1255" y="798" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="38" font-weight="normal" fill="#115EA2">n ← n+1</text>
<text x="1255" y="841" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="30" font-weight="normal" fill="#092F51">新层成为旧层</text>
<path d="M1072 776H1110" fill="none" stroke="#115EA2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1537 692L1642 776L1537 860L1432 776Z" fill="white" stroke="#115EA2" stroke-width="3"/>
<text x="1537" y="788" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="35" font-weight="normal" fill="#092F51">n &lt; M?</text>
<path d="M1399 776H1422" fill="none" stroke="#115EA2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1537 869V946H573V874" fill="none" stroke="#115EA2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1020" y="934" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="34" font-weight="normal" fill="#115EA2">是：用交换后的 old 继续下一步</text>
<path d="M1650 776H1720V1018H1585" fill="none" stroke="#115EA2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1667" y="910" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="38" font-weight="normal" fill="#115EA2">否</text>
<rect x="1115" y="984" width="470" height="68" rx="20" fill="#F8FBFE" stroke="#C9D7E3" stroke-width="3"/>
<g aria-label="n = M：取 old = U^M，结束">
<text x="1160.4" y="1030" font-family="SimHei, Arial, sans-serif" font-size="32" fill="#092F51">n = M：取 old = U</text>
<text x="1432.4" y="1017.84" font-family="SimHei, Arial, sans-serif" font-size="22.4" fill="#092F51">M</text>
<text x="1443.6000000000001" y="1030" font-family="SimHei, Arial, sans-serif" font-size="32" fill="#092F51">，结束</text>
</g>
<text x="400" y="1032" text-anchor="middle" font-family="SimHei, Arial, sans-serif" font-size="32" font-weight="normal" fill="#092F51">M ≥ 1；共推进 M 步，每层只交换一次</text>
</g>
</svg>