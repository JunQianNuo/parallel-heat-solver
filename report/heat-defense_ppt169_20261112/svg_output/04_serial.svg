<g id="serial-loop" data-pptx-bounds="40 140 1200 440"><text x="400" y="188" text-anchor="middle">初始化：旧场取初值，新场清零</text><line x1="400" y1="209" x2="400" y2="258" stroke="#115EA2" stroke-width="3" marker-end="url(#arrow)"/><rect x="160" y="260" width="480" height="100" fill="#115EA2" fill-opacity="0.07" stroke="#115EA2" stroke-width="2"/><text x="400" y="306" text-anchor="middle">遍历所有内部行、列</text><text x="400" y="347" text-anchor="middle" font-size="30">五点读旧场 → 写新场；边界清零</text><line x1="320" y1="362" x2="320" y2="428" stroke="#115EA2" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="407" font-size="30">整层完成</text><rect x="160" y="430" width="480" height="90" fill="#115EA2" fill-opacity="0.12" stroke="#115EA2" stroke-width="2"/><text x="400" y="486" text-anchor="middle">交换旧场、新场的角色</text><line x1="640" y1="428" x2="640" y2="362" stroke="#115EA2" stroke-width="3" marker-end="url(#arrow)"/><text x="665" y="405" font-size="30">未满 M 次，继续更新</text><line x1="642" y1="475" x2="870" y2="475" stroke="#115EA2" stroke-width="3" marker-end="url(#arrow)"/><text x="760" y="452" text-anchor="middle" font-size="30">完成 M 次</text><rect x="880" y="430" width="320" height="90" fill="#FFFFFF" stroke="#115EA2" stroke-width="2"/><text x="1040" y="486" text-anchor="middle">最终温度场</text><text x="1040" y="562" text-anchor="middle" font-size="30">计算误差并输出</text></g>
<g id="serial-baseline" data-pptx-bounds="40 590 1200 65"><text x="640" y="632" text-anchor="middle" fill="#115EA2" font-size="36">整层后换层，无需逐点复制；独立串行推进耗时作为 Tₛ</text></g>
