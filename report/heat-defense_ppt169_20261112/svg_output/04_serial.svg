<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="KaiTi, Arial" font-size="40" data-pptx-page-role="content">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#115EA2" stroke-width="1.5"/></marker></defs>
<rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="navigation" data-pptx-role="header" data-pptx-bounds="0 0 1280 48" font-family="SimHei, Arial" font-size="20"><rect width="1280" height="48" fill="#092F51"/><text x="40" y="29" fill="#8497A8">问题与模型</text><text x="510" y="29" fill="#FFFFFF">● 数值与并行方法</text><text x="1050" y="29" fill="#8497A8">结果与讨论</text></g>
