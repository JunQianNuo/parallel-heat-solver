<g id="title" data-pptx-bounds="56 35 1168 95" fill="#173B57"><text x="56" y="94" font-size="46" font-weight="bold">MPI分连续行，先换halo再更新</text></g>
<g id="partition" data-pptx-bounds="56 145 580 420"><text x="56" y="180" fill="#173B57">例：N=8，P=3，内部共7行</text><g fill="#F3F6F9" stroke="#D7E0E8" stroke-width="2"><rect x="56" y="215" width="580" height="100"/><rect x="56" y="335" width="580" height="80"/><rect x="56" y="435" width="580" height="80"/></g><g fill="#276FBF"><text x="80" y="255">rank 0</text><text x="80" y="385">rank 1</text><text x="80" y="485">rank 2</text></g><g fill="#253746" font-size="24"><text x="270" y="255">拥有全局行 1–3</text><text x="270" y="385">拥有全局行 4–5</text><text x="270" y="485">拥有全局行 6–7</text></g><g stroke="#276FBF" stroke-width="4"><line x1="420" y1="300" x2="420" y2="350"/><line x1="420" y1="402" x2="420" y2="450"/></g><g fill="#276FBF" font-size="24"><text x="455" y="330">交换旧层行</text><text x="455" y="430">交换旧层行</text></g><text x="56" y="550" fill="#5F6B76" font-size="24">每rank本地双缓冲，上下各一行halo</text></g>
<g id="mpi-contract" data-pptx-bounds="676 145 548 420" fill="#253746"><text x="676" y="180" fill="#276FBF" font-size="36" font-weight="bold">每步：通信 → 更新 → 交换</text><text x="676" y="255">两次 Sendrecv 获取旧层邻行<tspan x="676" dy="55">端部 PROC_NULL 仍须清零</tspan><tspan x="676" dy="55">本实现 P ≤ N−1，每rank一行起</tspan></text><text x="676" y="455" font-size="24" fill="#5F6B76">实际P = MPI_Comm_size<tspan x="676" dy="40">不均匀分块通过余数分配处理</tspan><tspan x="676" dy="40">推进后收集全场并验证解析误差</tspan></text></g>
<g id="baseline" data-pptx-bounds="56 585 1168 60" fill="#173B57"><text x="56" y="625" font-size="34" font-weight="bold">独立串行提供主基线 Ts；MPI单进程不能替代 Ts</text></g>
