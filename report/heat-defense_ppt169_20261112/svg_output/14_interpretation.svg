<g id="amdahl-equation" data-pptx-replace-with="formula" data-pptx-x="60" data-pptx-y="195" data-pptx-width="550" data-pptx-height="110" data-pptx-bounds="60 195 550 110"><metadata type="application/json">{"latex":"S_A(p)=\\frac{1}{f+(1-f)/p}","display":"block","font_size":36,"color":"#000000","align":"center"}</metadata><text x="95" y="255" font-size="36">Sₐ(p) =</text><text x="415" y="235" text-anchor="middle" font-size="36">1</text><line x1="290" y1="251" x2="570" y2="251" stroke="#000000" stroke-width="1.5"/><text x="430" y="292" text-anchor="middle" font-size="36">f + (1−f)/p</text></g>
