<g id="model-qualifiers" data-pptx-bounds="40 315 1200 100" font-size="30"><text x="80" y="349">f：理想模型中的串行时间比例。<tspan x="80" dy="44">实测有效比例不等于串行代码占比。</tspan></text><text x="730" y="349">σ：并行时间中的串行比例。<tspan x="730" dy="44">未单测；不能用 R/p 替代。</tspan></text></g>
