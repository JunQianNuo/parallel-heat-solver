<g id="navigation" data-pptx-role="header" data-pptx-bounds="0 0 1280 48" font-family="SimHei, Arial" font-size="20"><rect width="1280" height="48" fill="#092F51"/><text x="32" y="23" fill="#8497A8">问题与路线</text><text x="530" y="23" fill="#8497A8">数值与并行方法</text><text x="1080" y="23" fill="#FFFFFF">结果与讨论</text></g>
<g id="title" data-pptx-bounds="0 48 1280 62" font-family="SimHei, Arial"><rect x="0" y="48" width="1280" height="62" fill="#115EA2"/><text x="32" y="94" font-size="44" fill="#FFFFFF">备份：Amdahl、Gustafson与解释边界</text></g>
<g id="amdahl-formula" data-pptx-replace-with="formula" data-pptx-x="40" data-pptx-y="138" data-pptx-width="710" data-pptx-height="105" data-pptx-bounds="40 138 710 105"><metadata type="application/json">{"latex":"S_A(k)=\\frac{1}{f+(1-f)/k}","display":"block","font_size":36,"color":"#000000","align":"left"}</metadata><g font-family="Cambria Math" font-size="36" fill="#000000"><text x="45" y="198">S</text><text x="68" y="213" font-size="22">A</text><text x="90" y="198">(k) = 1 / [ f + (1−f)/k ]</text></g></g>
<g id="amdahl-scope" data-pptx-bounds="800 138 440 105" font-size="30" fill="#000000"><text x="800" y="175">固定问题，理想f&gt;0<tspan x="800" dy="50">模型极限1/f，非实测上限</tspan></text></g>
<g id="gustafson-formula" data-pptx-replace-with="formula" data-pptx-x="40" data-pptx-y="263" data-pptx-width="710" data-pptx-height="80" data-pptx-bounds="40 263 710 80"><metadata type="application/json">{"latex":"S_G(k)=k-\\sigma(k-1)","display":"block","font_size":36,"color":"#000000","align":"left"}</metadata><g font-family="Cambria Math" font-size="36" fill="#000000"><text x="45" y="312">S</text><text x="68" y="327" font-size="22">G</text><text x="90" y="312">(k) = k − σ(k−1)</text></g></g>
<g id="gustafson-scope" data-pptx-bounds="800 263 440 90" font-size="30" fill="#000000"><text x="800" y="297">扩大问题；σ未单测<tspan x="800" dy="40">并行时间未保持相近</tspan></text></g>
<g id="effective-f-formula" data-pptx-replace-with="formula" data-pptx-x="40" data-pptx-y="363" data-pptx-width="710" data-pptx-height="105" data-pptx-bounds="40 363 710 105"><metadata type="application/json">{"latex":"f_{\\mathrm{eff}}=\\frac{k/S-1}{k-1}\\quad(k&gt;1)","display":"block","font_size":36,"color":"#000000","align":"left"}</metadata><g font-family="Cambria Math" font-size="36" fill="#000000"><text x="45" y="425">f</text><text x="62" y="440" font-size="22">eff</text><text x="105" y="425">= (k/S−1) / (k−1)   (k&gt;1)</text></g></g>
<g id="effective-f-scope" data-pptx-bounds="800 363 440 105" font-size="30" fill="#000000"><text x="800" y="400">有效量含额外成本<tspan x="800" dy="50">不等于源码串行占比</tspan></text></g>
