<g id="method" data-pptx-bounds="56 135 1168 55" fill="#000000"><text x="56" y="175">时间向前Euler，空间中心差分；h=1/N，Δt=T/M。</text></g>
<g id="update-equation" data-pptx-replace-with="formula" data-pptx-x="56" data-pptx-y="205" data-pptx-width="1168" data-pptx-height="80" data-pptx-bounds="56 205 1168 80"><metadata type="application/json">{"latex":"U_{ij}^{n+1}=(1-4r)U_{ij}^{n}+r(U_{i-1,j}^{n}+U_{i+1,j}^{n}+U_{i,j-1}^{n}+U_{i,j+1}^{n})","display":"block","font_size":32,"color":"#000000","align":"center"}</metadata><g font-family="Cambria Math" fill="#000000"><text x="90" y="250">U</text><text x="115" y="229" font-size="24">n+1</text><text x="115" y="269" font-size="24">ij</text><text x="170" y="250">= (1−4r) U</text><text x="340" y="229" font-size="24">n</text><text x="340" y="269" font-size="24">ij</text><text x="385" y="250">+ r ( U</text><text x="490" y="229" font-size="24">n</text><text x="490" y="269" font-size="24">i−1,j</text><text x="575" y="250">+ U</text><text x="635" y="229" font-size="24">n</text><text x="635" y="269" font-size="24">i+1,j</text><text x="725" y="250">+ U</text><text x="785" y="229" font-size="24">n</text><text x="785" y="269" font-size="24">i,j−1</text><text x="875" y="250">+ U</text><text x="935" y="229" font-size="24">n</text><text x="935" y="269" font-size="24">i,j+1</text><text x="1030" y="250">)</text></g></g>
