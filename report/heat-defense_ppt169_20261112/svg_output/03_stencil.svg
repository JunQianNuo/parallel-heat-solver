<g id="update-equation" data-pptx-replace-with="formula" data-pptx-x="40" data-pptx-y="124" data-pptx-width="1200" data-pptx-height="126" data-pptx-bounds="40 124 1200 126" data-edit-target="true" data-edit-annotation="这种公式难看"><metadata type="application/json">{"latex":"\\begin{aligned}U_{ij}^{n+1}=(1-4r)U_{ij}^{n}\\\\\\quad+r(U_{i-1,j}^{n}+U_{i+1,j}^{n}+U_{i,j-1}^{n}+U_{i,j+1}^{n})\\end{aligned}","display":"block","font_size":36,"color":"#000000","align":"left"}</metadata><g font-family="Cambria Math" font-size="36" fill="#000000" id="_edit_15" data-edit-target="true" data-edit-annotation="这种公式难看"><text x="48" y="162" id="_edit_16" data-edit-target="true" data-edit-annotation="这种公式难看">U</text><text x="78" y="143" font-size="22" id="_edit_17" data-edit-target="true" data-edit-annotation="这种公式难看">n+1</text><text x="78" y="179" font-size="22" id="_edit_18" data-edit-target="true" data-edit-annotation="这种公式难看">i,j</text><text x="150" y="162" id="_edit_19" data-edit-target="true" data-edit-annotation="这种公式难看">= (1−4r) U</text><text x="335" y="143" font-size="22" id="_edit_20" data-edit-target="true" data-edit-annotation="这种公式难看">n</text><text x="335" y="179" font-size="22" id="_edit_21" data-edit-target="true" data-edit-annotation="这种公式难看">i,j</text><text x="150" y="230" id="_edit_22" data-edit-target="true" data-edit-annotation="这种公式难看">+ r ( U</text><text x="262" y="211" font-size="22" id="_edit_23" data-edit-target="true" data-edit-annotation="这种公式难看">n</text><text x="262" y="239" font-size="22" id="_edit_24" data-edit-target="true" data-edit-annotation="这种公式难看">i−1,j</text><text x="380" y="230" id="_edit_25" data-edit-target="true" data-edit-annotation="这种公式难看">+ U</text><text x="449" y="211" font-size="22" id="_edit_26" data-edit-target="true" data-edit-annotation="这种公式难看">n</text><text x="449" y="239" font-size="22" id="_edit_27" data-edit-target="true" data-edit-annotation="这种公式难看">i+1,j</text><text x="570" y="230" id="_edit_28" data-edit-target="true" data-edit-annotation="这种公式难看">+ U</text><text x="639" y="211" font-size="22" id="_edit_29" data-edit-target="true" data-edit-annotation="这种公式难看">n</text><text x="639" y="239" font-size="22" id="_edit_30" data-edit-target="true" data-edit-annotation="这种公式难看">i,j−1</text><text x="760" y="230" id="_edit_31" data-edit-target="true" data-edit-annotation="这种公式难看">+ U</text><text x="829" y="211" font-size="22" id="_edit_32" data-edit-target="true" data-edit-annotation="这种公式难看">n</text><text x="829" y="239" font-size="22" id="_edit_33" data-edit-target="true" data-edit-annotation="这种公式难看">i,j+1</text><text x="958" y="230" id="_edit_34" data-edit-target="true" data-edit-annotation="这种公式难看">)</text></g></g>
